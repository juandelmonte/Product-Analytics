name: saas-analytics

# ---------------------------------------------------------------------------
# SaaS Product Analytics Platform — Docker Compose
#
# Full stack. Only TWO services are exposed to the host (and thus to the
# internet on the VPS): dbt docs (8083) and Evidence (3000). Everything else
# lives on the internal Docker network only — no host port — which removes
# most port-collision risk on a shared VPS.
#
# Host-exposed ports (the only ones to open in the firewall):
#   8083 -> dbt docs    (renumbered from 8080, which is taken on the VPS)
#   3000 -> Evidence    (unchanged, free on the VPS)
#
# Airflow runs by default (no profile) so the daily_pipeline DAG keeps the
# marts fresh: advance simulation -> dlt incremental -> dbt build -> tests.
# ---------------------------------------------------------------------------

x-common-env: &common-env
  TZ: UTC

services:
  # -------------------------------------------------------------------------
  # PostgreSQL — operational state (the simulated SaaS source-of-truth)
  # INTERNAL ONLY (no host port). Reachable by other services as postgres:5432.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER:-saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas} -d ${POSTGRES_DB:-saas}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------
  # FastAPI — source-system-like APIs + simulation CLI
  # INTERNAL ONLY (no host port). Reachable by dlt as api:8000.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ./docker/api
    image: saas/source-api:0.1
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saas}:${POSTGRES_PASSWORD:-saas}@postgres:5432/${POSTGRES_DB:-saas}
      SEED: ${SEED:-42}
    volumes:
      - ${PROJECT_ROOT:-.}/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # -------------------------------------------------------------------------
  # ClickHouse — OLAP analytical warehouse
  # INTERNAL ONLY (no host port). Reachable by dbt/dlt/evidence as clickhouse:8123.
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.3}
    restart: unless-stopped
    environment:
      <<: *common-env
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      # HTTP interface (dbt, dlt, clickhouse-client --host, browser playground)
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------
  # dbt — transformation + testing + persistent docs server.
  # EXTERNAL: serves dbt docs on host port 8083 (container 8080).
  #
  # On `docker compose up`, this service runs `dbt docs serve` (a long-running
  # HTTP server) so the docs are reachable at :8083 without a manual step. It
  # waits for the one-time `bootstrap` to finish first — the bootstrap runs
  # `dbt build` then `dbt docs generate`, which produce the manifest/catalog
  # this server reads. For ad-hoc transformation/testing, invoke dbt explicitly
  # via `docker compose run --rm dbt <cmd>` (never auto-runs `dbt build`, which
  # would race the ingest on a cold start).
  # -------------------------------------------------------------------------
  dbt:
    build:
      context: ./docker/dbt
      args:
        DBT_CLICKHOUSE_VERSION: ${DBT_CLICKHOUSE_VERSION:-1.10.2}
        DBT_CORE_VERSION: ${DBT_CORE_VERSION:-1.10.23}
    image: saas/dbt-clickhouse:${DBT_CLICKHOUSE_VERSION:-1.10.2}
    environment:
      <<: *common-env
      DBT_TARGET: ${DBT_TARGET:-dev}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    volumes:
      - ${PROJECT_ROOT:-.}/dbt:/app
    depends_on:
      clickhouse:
        condition: service_healthy
      # Serve docs only AFTER the bootstrap has built the marts and generated
      # the catalog — otherwise docs serve would start against empty data.
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8083:8080"
    working_dir: /app
    restart: unless-stopped
    command: ["docs", "serve", "--port", "8080", "--host", "0.0.0.0"]

  # -------------------------------------------------------------------------
  # dlt — ingestion pipelines (run on demand; no long-running process)
  # INTERNAL ONLY (no host port). Orchestrated by the bootstrap service and
  # Airflow via `docker compose run --rm --no-deps`.
  # -------------------------------------------------------------------------
  dlt:
    build:
      context: ./docker/dlt
    image: saas/dlt:0.1
    environment:
      <<: *common-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      # dlt native client uses the TCP port + no TLS on the local dev stack
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_SECURE: "0"
      DESTINATION__CLICKHOUSE__CREDENTIALS__DATABASE: ${BRONZE_DB:-bronze}
      API_BASE_URL: http://api:8000
    volumes:
      - ${PROJECT_ROOT:-.}/dlt:/app
    depends_on:
      clickhouse:
        condition: service_healthy
      api:
        condition: service_started
    working_dir: /app

  # -------------------------------------------------------------------------
  # bootstrap — ONE-TIME full-pipeline initialisation.
  # Runs the complete chain on a cold start (empty volumes): operational
  # schema -> 24 months of simulated history -> dlt ingest -> dbt build ->
  # Evidence user + grant. It shells out to `docker compose run --rm` against
  # the mounted docker socket (like Airflow), so it works even though dlt/dbt
  # have no long-running process.
  #
  # Reuses the saas/airflow image because it already bundles the Docker CLI +
  # compose plugin + bash (it is the orchestration image). The `build:` block
  # is REQUIRED (not just `image:`) so a fresh clone / VPS `up --build` builds
  # the airflow image locally instead of trying to PULL `saas/airflow` from a
  # registry (where it does not exist). Idempotent + guarded:
  # it writes a marker file to the `bootstrap-state` volume when the chain
  # completes, so a re-run of `compose up` after a host reboot or redeploy sees
  # the marker and becomes a no-op. To force a full rebuild:
  #   docker compose down -v && docker compose up --build
  #
  # The service exits 0 when done (restart: "no"). `docker compose up` runs it
  # once in dependency order then leaves it exited; `docker compose logs
  # bootstrap` shows the chain output.
  # -------------------------------------------------------------------------
  bootstrap:
    build:
      context: ./docker/airflow
    image: saas/airflow:2.9.3
    user: root
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        MARKER=/bootstrap-state/.complete
        if [ -f "$$MARKER" ]; then
          echo "bootstrap: already complete ($$MARKER present) — nothing to do."
          exit 0
        fi
        echo "bootstrap: running full pipeline initialisation..."
        bash /workspace/scripts/bootstrap.sh
        echo "bootstrap: done."
        touch "$$MARKER"
    environment:
      <<: *common-env
      DOCKER_HOST: unix:///var/run/docker.sock
      COMPOSE_PROJECT_NAME: saas-analytics
      # Host-absolute path of the project. The nested `docker compose run`
      # calls re-resolve ${PROJECT_ROOT}/<svc> bind mounts against this so the
      # host daemon mounts the REAL host path (a relative mount would resolve
      # to /workspace/<svc>, which does not exist on the host -> empty /app).
      PROJECT_ROOT: ${PWD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      BRONZE_DB: ${BRONZE_DB:-bronze}
      SEED: ${SEED:-42}
      SIM_HISTORY_DAYS: ${SIM_HISTORY_DAYS:-720}
      EVIDENCE_CLICKHOUSE_PASSWORD: ${EVIDENCE_CLICKHOUSE_PASSWORD:-evidence}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:/workspace
      - bootstrap-state:/bootstrap-state
    depends_on:
      clickhouse:
        condition: service_healthy
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------------
  # Evidence — curated business report over the dbt marts
  # EXTERNAL: host port 3000.
  # -------------------------------------------------------------------------
  evidence:
    build:
      context: ./evidence
      dockerfile: ../docker/evidence/Dockerfile
    image: saas/evidence:0.1
    restart: unless-stopped
    environment:
      <<: *common-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      # Dedicated read-only user for Evidence (see scripts/activate.ps1).
      EVIDENCE_CLICKHOUSE_USER: ${EVIDENCE_CLICKHOUSE_USER:-evidence}
      EVIDENCE_CLICKHOUSE_PASSWORD: ${EVIDENCE_CLICKHOUSE_PASSWORD:-evidence}
      # Self-hosted Evidence requires Basic Auth unless auth is disabled.
      EVIDENCE_AUTH_DISABLED: "true"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
      # Evidence queries the marts as the dedicated `evidence` user — both only
      # exist after the one-time bootstrap (dbt build + grant). Starting it any
      # earlier means it points at empty/nonexistent data.
      bootstrap:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Airflow — orchestration (daily refresh). Runs by default (no profile).
  # INTERNAL ONLY: the webserver is not exposed to the host.
  # The scheduler runs daily_pipeline: sim day -> dlt ingest -> dbt build -> test.
  # -------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  airflow-webserver:
    build:
      context: ./docker/airflow
    image: saas/airflow:2.9.3
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: "dev-secret-not-for-prod"
      # Host-absolute project path for the DAGs' nested `docker compose run`
      # calls (see bootstrap service comment).
      PROJECT_ROOT: ${PWD}
    volumes:
      - ${PROJECT_ROOT:-.}/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:/workspace
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      # Start the scheduler only AFTER the one-time bootstrap has populated the
      # warehouse — otherwise daily_pipeline would race (and fail on) an empty
      # Postgres/ClickHouse on a cold `up`.
      bootstrap:
        condition: service_completed_successfully
    command: ["webserver"]

  airflow-scheduler:
    build:
      context: ./docker/airflow
    image: saas/airflow:2.9.3
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Host-absolute project path for the DAGs' nested `docker compose run`
      # calls (see bootstrap service comment).
      PROJECT_ROOT: ${PWD}
    volumes:
      - ${PROJECT_ROOT:-.}/airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:/workspace
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      # Start the scheduler only AFTER the one-time bootstrap has populated the
      # warehouse — otherwise daily_pipeline would race (and fail on) an empty
      # Postgres/ClickHouse on a cold `up`.
      bootstrap:
        condition: service_completed_successfully
    command: ["scheduler"]

  airflow-init:
    build:
      context: ./docker/airflow
    image: saas/airflow:2.9.3
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ${PROJECT_ROOT:-.}/airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-postgres:
        condition: service_healthy
    # Airflow 2.9.3 requires `db init` (creates the FAB/webserver tables +
    # admin user), NOT just `db migrate`. Without it the webserver exits with
    # "You need to initialize the database".
    command: ["db", "init"]
    restart: "no"

volumes:
  postgres-data:
  clickhouse-data:
  airflow-postgres-data:
  bootstrap-state:
