# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models.
name: "saas_analytics"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "analytics"

# Paths — defaults are used if omitted.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Default model settings.
# ClickHouse tables need a sort key: staging/intermediate/marts are created
# with MergeTree and a tuple() ORDER BY. The default (top-level) materialization
# stays `view` for any models not nested under a configured folder.
models:
  saas_analytics:
    +materialized: view
    staging:
      +materialized: table
      +schema: staging
      +engine: MergeTree()
      +order_by: "tuple()"
    intermediate:
      +materialized: table
      +schema: core
      +engine: MergeTree()
      +order_by: "tuple()"
    marts:
      +materialized: table
      +schema: marts
      +engine: MergeTree()
      +order_by: "tuple()"
